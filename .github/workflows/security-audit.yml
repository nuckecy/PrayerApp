# Security Audit Workflow
# Runs automated security checks on every pull request and weekly schedule

name: Security Audit

on:
  # Run on all pull requests
  pull_request:
    branches:
      - main
      - develop

  # Run on push to main branch
  push:
    branches:
      - main

  # Run weekly security scan
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC

  # Allow manual trigger
  workflow_dispatch:

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || true
          echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit --json | jq -r '.vulnerabilities | to_entries | .[] | "- **\(.key)**: \(.value.severity)"' >> $GITHUB_STEP_SUMMARY || true

      - name: Check for critical vulnerabilities
        run: |
          cd frontend
          # Fail if critical or high vulnerabilities are found
          npm audit --audit-level=high

  dependency-check:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Check for outdated packages
        run: |
          cd frontend
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          npm outdated || true

  code-scanning:
    name: Code Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          # Check for potential hardcoded secrets
          echo "Scanning for potential secrets..."

          # Check for API keys
          if grep -r "SUPABASE_SERVICE_ROLE_KEY.*=" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" frontend/; then
            echo "⚠️ Warning: Potential service role key found in code!"
            exit 1
          fi

          # Check for hardcoded credentials
          if grep -ri "password.*=.*['\"]" --include="*.ts" --include="*.tsx" frontend/ | grep -v "formData.password" | grep -v "type.*password" | grep -v "placeholder"; then
            echo "⚠️ Warning: Potential hardcoded password found!"
            exit 1
          fi

          echo "✅ No secrets detected"

      - name: Scan for dangerous patterns
        run: |
          echo "Scanning for dangerous code patterns..."

          # Check for dangerouslySetInnerHTML
          if grep -r "dangerouslySetInnerHTML" --include="*.tsx" --include="*.jsx" frontend/; then
            echo "⚠️ Warning: dangerouslySetInnerHTML usage found (XSS risk)"
            # Don't fail, just warn
          fi

          # Check for eval usage
          if grep -r "eval(" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" frontend/; then
            echo "⚠️ Warning: eval() usage found (security risk)"
            exit 1
          fi

          echo "✅ No dangerous patterns detected"

      - name: Verify environment variable usage
        run: |
          echo "Checking environment variable security..."

          # Ensure no direct process.env usage (should use validated env.ts)
          if grep -r "process\.env\." --include="*.ts" --include="*.tsx" frontend/ | grep -v "frontend/lib/env.ts" | grep -v "next.config"; then
            echo "⚠️ Warning: Direct process.env usage found. Should use validated env.ts"
            # Don't fail, just warn
          fi

          echo "✅ Environment variable check complete"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [npm-audit, dependency-check, code-scanning]
    if: always()

    steps:
      - name: Report Status
        run: |
          echo "# Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security checks completed. Review the individual job outputs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Review and address any critical or high severity vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- Keep dependencies up to date" >> $GITHUB_STEP_SUMMARY
          echo "- Follow secure coding practices" >> $GITHUB_STEP_SUMMARY
          echo "- Never commit secrets or credentials" >> $GITHUB_STEP_SUMMARY
